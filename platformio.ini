; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = spiffs
build_src_filter = +<*> -<image.cpp>
; PNGdec needs two 800-pixel RGBA scanlines plus its internal alignment padding.
build_flags = -D APP_DEBUG_LOGS=0 -D APP_ENABLE_LIGHT_SLEEP=1 -D APP_SLEEP_QUIET_LOGS=0 -D APP_WIFI_SCAN_DIAG_LOGS=0 -D PNG_MAX_BUFFERED_PIXELS=6464
lib_deps =
  bitbank2/PNGdec
  bitbank2/JPEGDEC
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
